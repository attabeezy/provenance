[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "provenance"
version = "0.1.0"
description = "Reproducibility codebase for the position paper 'Authorship Needs Provenance, Not Prediction'"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scikit-learn",
    "matplotlib",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
prov = "provenance.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
